<!DOCTYPE html>
{% extends 'index.html' %}
{% block content %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div class="col-12 grid-margin stretch-card">
              <div class="card">
                <div class="card-body">
                  <h4 class="card-title">Add Category</h4>
                  <p class="card-description">
                    Please Add The Movie Category...!
                  </p>
                  <form class="forms-sample" method="post" action="{% url 'savedata_Category' %}" enctype="multipart/form-data">
                      {% csrf_token %}
                    <div class="form-group">
                      <label for="exampleInputName1">Title</label>
                      <input type="text" class="form-control" id="exampleInputName1" placeholder="Title" name="title">
                    </div>
                     <div class="form-group">
                      <label for="exampleTextarea1">Description</label>
                      <textarea class="form-control" id="exampleTextarea1" rows="4"  name="description"></textarea>
                    </div>
                    <div class="form-group">
                      <label for="exampleInputName1">Release Date</label>
                      <input type="text" class="form-control" id="exampleInputName1" placeholder="Release Date" name="release_date">
                    </div>
                    <div class="form-group">
                      <label for="exampleInputName1">Genre</label>
                      <input type="text" class="form-control" id="exampleInputName1" placeholder="Genre" name="genre">
                    </div>
                    <div class="form-group">
                      <label for="exampleInputName1">Length</label>
                      <input type="text" class="form-control" id="exampleInputName1" placeholder="Length" name="length">
                    </div>
                    <div class="form-group">
                      <label for="exampleInputName1">Image Card</label>
                      <input type="file" class="form-control" name="img_crd">
                    </div>
                     <div class="form-group">
                      <label for="exampleInputName1">Image Cover</label>
                      <input type="file" class="form-control" name="img_cvr">
                    </div>
<!--                     <div class="form-group">-->
<!--                      <label for="exampleInputName1">Video</label>-->
<!--                      <input type="file" class="form-control" name="video">-->
<!--                    </div>-->
                    <div class="form-group">
                      <label for="exampleInputName1">Views</label>
                      <input type="text" class="form-control" id="exampleInputName1" placeholder="Views" name="views">
                    </div>

<!--                          <button class="file-upload-browse btn btn-primary" type="button">Upload</button>-->
<!--                        </span>-->
<!--                      </div>-->
<!--                    </div>-->

                    <button type="submit" class="btn btn-primary mr-2">Submit</button>
                    <button class="btn btn-light">Cancel</button>
                  </form>
                </div>
              </div>
            </div>

</body>
</html>
{% endblock %}
